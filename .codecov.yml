coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
ignore:
  # The test runner drives the tests; its server path never runs under coverage.
  - "src/testing/custom_test_runner.zig"
  # Generated by openapi2zig. A test compiles them all, which would otherwise count
  # their unused code against coverage.
  - "src/providers/openai/client.zig"
  - "src/providers/openai/contracts.zig"
  - "src/providers/lmstudio/client.zig"
  - "src/providers/lmstudio/contracts.zig"
  - "src/providers/anthropic/client.zig"
  - "src/providers/anthropic/contracts.zig"
  - "src/providers/google/client.zig"
  - "src/providers/google/contracts.zig"
