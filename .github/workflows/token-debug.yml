name: Token Debug
on:
  push:
    branches:
      - changelog-generator

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate changelog with INPUT_GITHUB_TOKEN env
        id: changelog
        uses: christianhelle/changelog-generator-action@v1
        with:
          output: CHANGELOG_VERIFY.md
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
