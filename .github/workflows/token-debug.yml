name: Token Debug
on:
  push:
    branches:
      - changelog-generator

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test token input propagation
        uses: ./.github/actions/token-debug
        with:
          test-token: ${{ github.token }}
